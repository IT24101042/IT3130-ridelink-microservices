server.port=8081

# MongoDB (database "driver_db" is created automatically on first write)
spring.mongodb.uri=mongodb://localhost:27017/driver_db
spring.data.mongodb.auto-index-creation=true

# Must be identical across all four services. No default on purpose.
app.jwt.secret=${JWT_SECRET:this-is-a-temporary-dev-secret-must-match-all-four-services-change-me}

# Eligibility rules (simulated)
app.driver.default-radius-km=5
app.driver.max-location-age-minutes=30
