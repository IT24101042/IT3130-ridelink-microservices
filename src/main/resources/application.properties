server.port=8082

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ride_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Must be identical across all four services. No default on purpose.
app.jwt.secret=${JWT_SECRET}

# Other services (synchronous REST)
app.services.driver-url=${DRIVER_SERVICE_URL:http://localhost:8081}
app.services.fare-url=${FARE_SERVICE_URL:http://localhost:8083}
app.services.connect-timeout-ms=2000
app.services.read-timeout-ms=5000

# Dev only: show the underlying exception in error responses. Keep false for the demo.
app.errors.include-cause=${INCLUDE_ERROR_CAUSE:false}